name: phs-soliton
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: phs-soliton
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
      - run: uv sync --frozen
      - run: make starter
      - run: make test
      - run: make mutants
      - run: make prereg-check
