name: fringes
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "fringes/**"
      - "phs-soliton/phs/**"
      - "phs-soliton/pyproject.toml"
      - "phs-soliton/uv.lock"
      - ".github/workflows/fringes.yml"
jobs:
  ring:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --frozen
        working-directory: phs-soliton
      - run: bash fringes/ci.sh
      - name: frozen snapshot, replayed from its weights
        run: phs-soliton/.venv/bin/python fringes/artifacts/verify.py fringes/artifacts/pr7-2026-10-28
      - name: the snapshot check must be able to fail
        run: phs-soliton/.venv/bin/python fringes/artifacts/verify.py fringes/artifacts/pr7-2026-10-28 --bite
      - name: rounding study, replayed from the frozen exports
        run: phs-soliton/.venv/bin/python fringes/artifacts/verify.py fringes/artifacts/rounding-2026-10-28
      - name: the rounding check must be able to fail
        run: phs-soliton/.venv/bin/python fringes/artifacts/verify.py fringes/artifacts/rounding-2026-10-28 --bite
      - name: honest decoders, replayed from the frozen checkpoint
        run: phs-soliton/.venv/bin/python fringes/artifacts/verify.py fringes/artifacts/readout-2026-10-28 --full
      - name: the decoder check must be able to fail
        run: phs-soliton/.venv/bin/python fringes/artifacts/verify.py fringes/artifacts/readout-2026-10-28 --bite
      - name: the frozen decoders, rescored on readout's own test cells
        run: phs-soliton/.venv/bin/python fringes/artifacts/verify.py fringes/artifacts/decoder-2026-10-29
      - name: the frozen-decoder check must be able to fail
        run: phs-soliton/.venv/bin/python fringes/artifacts/verify.py fringes/artifacts/decoder-2026-10-29 --bite
      - name: transfer (one whole run with the frozen decoders) and clock law, replayed from the frozen checkpoints
        run: phs-soliton/.venv/bin/python fringes/artifacts/verify.py fringes/artifacts/transfer-2026-10-29b --full
      - name: the transfer check must be able to fail
        run: phs-soliton/.venv/bin/python fringes/artifacts/verify.py fringes/artifacts/transfer-2026-10-29b --bite --full
      - name: spin echo, replayed from the frozen checkpoints
        run: phs-soliton/.venv/bin/python fringes/artifacts/verify.py fringes/artifacts/echo-2026-10-29
      - name: the echo check must be able to fail
        run: phs-soliton/.venv/bin/python fringes/artifacts/verify.py fringes/artifacts/echo-2026-10-29 --bite
      - name: dynamical decoupling, replayed from the frozen checkpoints
        run: phs-soliton/.venv/bin/python fringes/artifacts/verify.py fringes/artifacts/decouple-2026-10-29
      - name: the decoupling check must be able to fail
        run: phs-soliton/.venv/bin/python fringes/artifacts/verify.py fringes/artifacts/decouple-2026-10-29 --bite
