name: fringes
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "fringes/**"
      - "phs-soliton/phs/**"
      - "phs-soliton/pyproject.toml"
      - "phs-soliton/uv.lock"
      - ".github/workflows/fringes.yml"
jobs:
  ring:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --frozen
        working-directory: phs-soliton
      - run: bash fringes/ci.sh
