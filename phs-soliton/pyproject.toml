[project]
name = "phs-soliton"
version = "0.1.0"
description = "Pure-PHS / Soliton-PHS / Control-GRU controlled experiment (lab, private)"
requires-python = "==3.13.*"
dependencies = [
    "torch==2.14.1",
    "numpy==2.5.3",
    "matplotlib==3.11.2",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
